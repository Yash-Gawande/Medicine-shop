[project]
name = "pharmacy-backend"
version = "0.1.0"
description = "Online pharmacy platform API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.127",
    "celery>=5.7.0",
    "fastapi[standard]>=0.162.2",
    "orjson>=3.13.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "razorpay>=2.0.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
